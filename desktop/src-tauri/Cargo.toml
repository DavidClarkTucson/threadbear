[package]
name = "threadbear-desktop"
version = "0.1.0"
description = "Threadbear for Linux, Windows and Mac: a window onto the runner's threads"
edition = "2021"
publish = false

[lib]
name = "threadbear_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
threadbear-client = { path = "../client" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
