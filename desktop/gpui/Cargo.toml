[package]
name = "threadbear-gpui"
version = "0.1.0"
description = "Threadbear as a native GPUI app (a spike, beside the Tauri one)"
edition = "2021"
publish = false

[dependencies]
threadbear-client = { path = "../client" }
gpui-kit = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
