# The desktop apps (desktop/: the Tauri spike and the GPUI spike, sharing
# one runner connection) on Linux, Mac and Windows: the Tauri interface's
# tests, every Rust test (including signing in to the mock runner), and a
# build of each platform's apps to download from the run's artifacts.
# Nothing is signed: the Mac app needs right-click Open the first time, and
# Windows SmartScreen asks once.
name: Desktop app

on:
  push:
    branches: [main, desktop-spike]
    paths:
      - desktop/**
      - runner/src/protocol.ts
      - runner/src/rpc-auth.ts
      - web/src/sections.ts
      - web/src/format.ts
      - app/Tools/mock-runner/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - runner/src/protocol.ts
      - runner/src/rpc-auth.ts
      - web/src/sections.ts
      - web/src/format.ts
      - app/Tools/mock-runner/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, bundles: deb }
          - { name: Mac, os: macos-26, bundles: 'app,dmg' }
          - { name: Windows, os: windows-latest, bundles: nsis }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libvulkan-dev
      - name: Install
        run: |
          npm ci --prefix desktop
          npm ci --prefix app/Tools/mock-runner
      - name: Interface typecheck and tests
        working-directory: desktop
        run: npm run typecheck && npm test
      - name: Rust tests (with the mock runner)
        run: cargo test --manifest-path desktop/Cargo.toml
      - name: Build the Tauri app
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Build the GPUI app
        run: cargo build --release --manifest-path desktop/Cargo.toml -p threadbear-gpui
      - uses: actions/upload-artifact@v4
        with:
          name: threadbear-desktop-${{ matrix.name }}
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/threadbear-gpui
            desktop/target/release/threadbear-gpui.exe
          if-no-files-found: error
